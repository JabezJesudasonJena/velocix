version: '3.9'

services:
  backend:
    build: .
    container_name: ecommerce_backend
    ports:
      - '3000:3000'
    
    volumes:
      - ./app
      - /app/node_modules
    
    env_file:
      ./app/env
    
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:17
    container_name: velocix_postgres
    restart: unless_stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass 
      POSTGRES_DB: velocixdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    